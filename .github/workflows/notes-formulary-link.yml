# Recomputes only the RxNorm -> CY2026 Part D formulary link inside notes_extraction.json,
# without rerunning the LLM extraction.
name: notes-formulary-link
on:
  workflow_dispatch:
  push:
    branches: [pharmacy-claims-analytics]
    paths:
      - .github/workflows/notes-formulary-link.yml
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: pharmacy-claims-analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Link
        run: |
          set -o pipefail
          git clone https://github.com/jche253/Glaucoma_Med_Dataset "$RUNNER_TEMP/glaucoma"
          git -C "$RUNNER_TEMP/glaucoma" checkout 15e67ea86ed0678425ec0948032f3fe9f77f30db
          python -m pbm.notes_extraction --data "$RUNNER_TEMP/glaucoma" --out reports --raw "$RUNNER_TEMP/cms" --link-only 2>&1 | tee reports/notes_link.log
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898315+github-actions[bot]@users.noreply.github.com"
          git add -f reports/notes_extraction.json reports/notes_link.log
          git commit -m "CI: notes formulary link (run ${GITHUB_RUN_ID}, ${{ job.status }})" || echo "nothing to commit"
          for i in 1 2 3; do git pull --rebase origin pharmacy-claims-analytics && git push origin HEAD:pharmacy-claims-analytics && break; sleep 5; done
