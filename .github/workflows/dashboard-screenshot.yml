# Renders the scoring service's /dashboard in headless Chromium after replaying real formulary
# rows through normal, invalid-payload and drift phases; commits the screenshots.
name: dashboard-screenshot
on:
  workflow_dispatch:
  push:
    branches: [pharmacy-claims-analytics]
    paths:
      - pharmacy-claims-analytics/pbm/dashboard.html
      - pharmacy-claims-analytics/tests/dashboard_screenshot.py
      - .github/workflows/dashboard-screenshot.yml
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pharmacy-claims-analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Screenshot dashboard
        run: PYTHONPATH=. python tests/dashboard_screenshot.py 2>&1 | tee reports/dashboard_screenshot.log
      - name: Commit outputs (always)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898315+github-actions[bot]@users.noreply.github.com"
          git add -f reports/dashboard_*.png reports/dashboard_screenshot.json reports/dashboard_screenshot.log 2>/dev/null || true
          git commit -m "CI: dashboard screenshots (run ${GITHUB_RUN_ID}, ${{ job.status }})" || echo "nothing to commit"
          for i in 1 2 3; do git pull --rebase origin pharmacy-claims-analytics && git push origin HEAD:pharmacy-claims-analytics && break; sleep 5; done
